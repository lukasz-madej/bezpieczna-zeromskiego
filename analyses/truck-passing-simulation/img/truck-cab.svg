<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 652" role="img" aria-label="Schematyczny rysunek kabiny ciężarówki Volvo FH, widok z przodu">
  <!-- Line-drawing tracing of the reference Volvo FH front-view photograph:
       flat overhanging roof visor, wide single-piece windshield, wing mirrors,
       dark trim band with wipers, chrome strip with badge, VOLVO/FH grille
       lettering, mesh grille, corner headlights, bumper and plate. Drawn as a
       schematic (not a photo) so it stays lightweight and stylistically
       consistent with the rest of the diagram. -->

  <!-- wing mirrors (drawn first so the cab body overlaps their inner edge) -->
  <g stroke="#1a1c1f" stroke-width="4" stroke-linejoin="round">
    <polygon points="56,102 56,142 66,152 66,108" fill="#2b2e33" />
    <rect x="2" y="66" width="56" height="180" rx="20" fill="#2b2e33" />
    <rect x="13" y="88" width="34" height="76" rx="8" fill="#b7c4c9" stroke-width="2.5" />

    <polygon points="544,102 544,142 534,152 534,108" fill="#2b2e33" />
    <rect x="542" y="66" width="56" height="180" rx="20" fill="#2b2e33" />
    <rect x="553" y="88" width="34" height="76" rx="8" fill="#b7c4c9" stroke-width="2.5" />
  </g>

  <!-- cab body silhouette -->
  <path d="M180,14
           L420,14
           Q430,14 430,26
           L430,40
           Q500,70 536,130
           L536,632
           Q536,650 518,650
           L82,650
           Q64,650 64,632
           L64,130
           Q100,70 170,40
           L170,26
           Q170,14 180,14 Z"
        fill="#ece7d9" stroke="#1a1c1f" stroke-width="4" stroke-linejoin="round" />

  <!-- windshield -->
  <path d="M96,62 L504,62 L525,225 L75,225 Z"
        fill="#cfe3ea" stroke="#1a1c1f" stroke-width="4" stroke-linejoin="round" />
  <line x1="300" y1="62" x2="300" y2="225" stroke="#1a1c1f" stroke-width="3" />

  <!-- wipers, resting near the base of the windshield -->
  <path d="M128,214 L230,110" fill="none" stroke="#1a1c1f" stroke-width="4" stroke-linecap="round" />
  <path d="M472,214 L370,110" fill="none" stroke="#1a1c1f" stroke-width="4" stroke-linecap="round" />

  <!-- dark cab trim band below the windshield -->
  <rect x="70" y="230" width="460" height="46" rx="6" fill="#2b2e33" />

  <!-- chrome strip with Volvo emblem -->
  <rect x="70" y="278" width="460" height="18" rx="4" fill="#c9ccd1" />
  <circle cx="300" cy="287" r="17" fill="#ece7d9" stroke="#1a1c1f" stroke-width="3" />
  <line x1="291" y1="296" x2="316" y2="271" stroke="#1a1c1f" stroke-width="3" stroke-linecap="round" />
  <line x1="311" y1="271" x2="322" y2="271" stroke="#1a1c1f" stroke-width="3" stroke-linecap="round" />
  <line x1="322" y1="271" x2="322" y2="282" stroke="#1a1c1f" stroke-width="3" stroke-linecap="round" />

  <!-- grille with wordmarks -->
  <rect x="140" y="330" width="320" height="150" rx="14" fill="#26282c" stroke="#1a1c1f" stroke-width="3" />
  <line x1="140" y1="360" x2="460" y2="360" stroke="#45484e" stroke-width="3" />
  <line x1="140" y1="390" x2="460" y2="390" stroke="#45484e" stroke-width="3" />
  <line x1="140" y1="420" x2="460" y2="420" stroke="#45484e" stroke-width="3" />
  <line x1="140" y1="450" x2="460" y2="450" stroke="#45484e" stroke-width="3" />
  <text x="163" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="2" fill="#ece7d9">VOLVO</text>
  <text x="410" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="1" fill="#ece7d9">FH</text>

  <!-- headlights -->
  <rect x="70" y="460" width="92" height="92" rx="22" fill="#f5efd8" stroke="#1a1c1f" stroke-width="3" />
  <circle cx="116" cy="506" r="26" fill="none" stroke="#1a1c1f" stroke-width="2.5" />
  <rect x="438" y="460" width="92" height="92" rx="22" fill="#f5efd8" stroke="#1a1c1f" stroke-width="3" />
  <circle cx="484" cy="506" r="26" fill="none" stroke="#1a1c1f" stroke-width="2.5" />

  <!-- bumper -->
  <rect x="45" y="576" width="510" height="46" rx="14" fill="#c7cbd1" stroke="#1a1c1f" stroke-width="3" />

  <!-- license plate -->
  <rect x="245" y="596" width="110" height="28" rx="4" fill="#f4f4f2" stroke="#1a1c1f" stroke-width="2.5" />
</svg>
